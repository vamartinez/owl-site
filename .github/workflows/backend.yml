name: Backend CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'packages/backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'packages/backend/**'
      - '.github/workflows/backend.yml'

# OIDC deploy needs id-token write; contents read for checkout.
permissions:
  id-token: write
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter backend lint

      - name: Test
        run: pnpm --filter backend test

      # Gate merges on the property-based test suite (fast-check) so a future
      # frontend/backend contract change (e.g. the report-validation query
      # params guarded by reports-query-contract.property.test.ts) fails CI
      # instead of shipping silently broken to dev.
      - name: Property tests
        run: pnpm --filter backend test:properties

      - name: Build
        run: pnpm --filter backend build

      - name: CDK Synth
        run: pnpm --filter backend synth

  # ─── Deploy to the dev environment ───────────────────────────────────────
  # Only runs on a push to `develop` (never on PRs or on main), after CI is
  # green. Deploys ALL CDK stacks via `pnpm deploy:dev`, which includes the
  # HostingStack that publishes whatever admin-portal / landing-page `dist`
  # is present. Frontend content is refreshed by the admin-portal / landing-page
  # workflows, which redeploy the HostingStack with a freshly built `dist`.
  deploy-dev:
    name: Deploy (dev)
    needs: build-and-test
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy all stacks to dev
        run: pnpm deploy:dev -- --require-approval never
